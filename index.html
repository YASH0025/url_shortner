<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
</head>
<body>
    <h1>URL Shortener</h1>

    <form id="urlForm">
        <label for="url">Enter URL:</label>
        <input
            type="url"
            id="url"
           
            required
        >
        <button type="submit">Short URL</button>
    </form>

    <p id="message"></p>
    <p id="result"></p>

    <script src="/app.js"></script>
</body>
</html>
